# rpi-ble-provision configuration. Command-line flags override these values.
# See `rpi-ble-provision --help`.

# 128-bit provisioning service UUID; must end in 00. The characteristics use the
# same UUID ending in 01 (SSID list), 02 (credentials) and 03 (status). The
# mobile app must scan for the same UUID.
#service_uuid = 7a8b4e10-9c2d-4f3a-bf21-0a1b2c3d4e00

# Advertised Bluetooth name (up to 29 bytes fits in an advertisement). Set
# either name or name_file; with neither, the name is rpi-prov-<last 4 of serial>.
#name = Kitchen Display
# Edits to this file or to /etc/rpi-ble-provision.name restart the service
# (rpi-ble-provision-reload.path); a name_file elsewhere is not watched.
#name_file = /etc/rpi-ble-provision.name
